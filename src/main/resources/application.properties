spring.application.name=Deutschprojekt
spring.config.import=optional:file:.env[.properties]
security.jwt.secret-base64=${JWT_SECRET:}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/deutschprojekt}
spring.datasource.username=${DB_USERNAME:deutschprojekt}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:4200}
