<section class="auth-card">
  <p class="eyebrow">START LEARNING</p>
  <h1>Your next word awaits.</h1>
  <p class="intro">Create an account to practice German vocabulary at your own pace.</p>

  @if (errorMessage) {
    <p class="error" role="alert">{{ errorMessage }}</p>
  }

  <form (ngSubmit)="submit()">
    <label for="username">Username</label>
    <input
      id="username"
      name="username"
      [(ngModel)]="username"
      autocomplete="username"
      required
    />

    <label for="email">Email</label>
    <input
      id="email"
      name="email"
      [(ngModel)]="email"
      type="email"
      autocomplete="email"
      required
    />

    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      [(ngModel)]="password"
      type="password"
      autocomplete="new-password"
      required
    />

    <label for="confirm-password">Confirm password</label>
    <input
      id="confirm-password"
      name="confirmPassword"
      [(ngModel)]="confirmPassword"
      type="password"
      autocomplete="new-password"
      required
    />

    <button class="primary-button" type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Creating account…' : 'Create account' }}
    </button>
  </form>

  <p class="switch-link">Already have an account? <a routerLink="/login">Sign in</a></p>
</section>
