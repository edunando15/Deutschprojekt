<section class="auth-card">
  <p class="eyebrow">YOUR GERMAN PRACTICE</p>
  <h1>Welcome back.</h1>
  <p class="intro">Sign in to pick up where your next German word begins.</p>

  @if (registered) {
    <p class="notice" role="status">Your account is ready. Sign in to start practicing.</p>
  }
  @if (errorMessage) {
    <p class="error" role="alert">{{ errorMessage }}</p>
  }

  <form (ngSubmit)="submit()">
    <label for="username">Username</label>
    <input
      id="username"
      name="username"
      [(ngModel)]="username"
      autocomplete="username"
      required
    />

    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      [(ngModel)]="password"
      type="password"
      autocomplete="current-password"
      required
    />

    <button class="primary-button" type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="switch-link">New here? <a routerLink="/register">Create an account</a></p>
</section>
